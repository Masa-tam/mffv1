name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    name: Windows smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show CMake version
        run: cmake --version

      - name: Check Markdown links
        run: cmake -DMFFV1_MARKDOWN_LINK_ROOT=. -P cmake\CheckMarkdownLinks.cmake

      - name: Check public tracked files
        run: cmake -P cmake\CheckPublicTrackedFiles.cmake

      - name: Configure
        run: cmake -S . -B build\ci -DMFFV1_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build\ci --config Debug

      - name: Test
        run: ctest --test-dir build\ci -C Debug --output-on-failure

      - name: Package smoke
        run: >
          cmake
          -DMFFV1_PACKAGE_SMOKE_PROJECT_BUILD_DIR=build\ci
          -DMFFV1_PACKAGE_SMOKE_BUILD_DIR=build\package-smoke
          -DMFFV1_PACKAGE_SMOKE_INSTALL_DIR=build\package-smoke\install
          -DMFFV1_PACKAGE_SMOKE_CONFIG=Debug
          -P cmake\RunPackageSmoke.cmake

  linux-smoke:
    name: Linux ${{ matrix.compiler }} smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show tool versions
        run: |
          cmake --version
          ${{ matrix.cxx }} --version

      - name: Check Markdown links
        run: cmake -DMFFV1_MARKDOWN_LINK_ROOT=. -P cmake/CheckMarkdownLinks.cmake

      - name: Check public tracked files
        run: cmake -P cmake/CheckPublicTrackedFiles.cmake

      - name: Configure
        run: >
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DMFFV1_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

      - name: Package smoke
        run: >
          cmake
          -DMFFV1_PACKAGE_SMOKE_PROJECT_BUILD_DIR=build/ci
          -DMFFV1_PACKAGE_SMOKE_BUILD_DIR=build/package-smoke
          -DMFFV1_PACKAGE_SMOKE_INSTALL_DIR=build/package-smoke/install
          -DMFFV1_PACKAGE_SMOKE_CONFIG=Debug
          -P cmake/RunPackageSmoke.cmake

  no-status-smoke:
    name: No-status package smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build/no-status
          -DCMAKE_BUILD_TYPE=Release
          -DMFFV1_ENABLE_STATUS_MESSAGES=OFF
          -DMFFV1_BUILD_STATUS_CONTRACT_TESTS_ONLY=ON

      - name: Build
        run: cmake --build build/no-status

      - name: Test status contract
        run: ctest --test-dir build/no-status --output-on-failure

      - name: Package smoke
        run: >
          cmake
          -DMFFV1_PACKAGE_SMOKE_PROFILE=no-status
          -DMFFV1_PACKAGE_SMOKE_PROJECT_BUILD_DIR=build/no-status
          -DMFFV1_PACKAGE_SMOKE_BUILD_DIR=build/no-status-package-smoke
          -DMFFV1_PACKAGE_SMOKE_INSTALL_DIR=build/no-status-package-smoke/install
          -DMFFV1_PACKAGE_SMOKE_CONFIG=Release
          -DMFFV1_PACKAGE_SMOKE_EXPECT_STATUS_MESSAGES=0
          -P cmake/RunPackageSmoke.cmake
